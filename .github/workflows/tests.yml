name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v7
      # Host reference CLI. Pinned to xbox-gpu-training main, the accepted
      # 0.1.0.105 trainer source (128434e). Native tests run it with --reference.
      - name: Checkout pinned host trainer
        uses: actions/checkout@v7
        with:
          repository: gianlucamazza/xbox-gpu-training
          ref: 128434e81837ec1558f7e3d68a7f8849a91aa054
          path: xbox-gpu-training
          persist-credentials: false
      - name: Build xgpu_e0_train
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake libssl-dev
          cmake -S xbox-gpu-training -B xbox-gpu-training/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DXGPU_BUILD_EXAMPLES=OFF
          cmake --build xbox-gpu-training/build --target xgpu_e0_train --parallel
          test -x xbox-gpu-training/build/xgpu_e0_train
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests scripts experiments
      - name: Host contracts, recovery, unit and native reference tests
        env:
          XGPU_E0_BINARY: ${{ github.workspace }}/xbox-gpu-training/build/xgpu_e0_train
        run: python -m pytest -q
